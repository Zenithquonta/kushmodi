<svg xmlns="http://www.w3.org/2000/svg" width="360" height="136" viewBox="0 0 360 136" role="img" aria-labelledby="t-flight d-flight"><title id="t-flight">02 / FLIGHT DECK</title><desc id="d-flight">Navigation card for the aviation and exploration mission log, showing a pixel aircraft seen from above, the label 02 / FLIGHT DECK and the prompt to open the mission log. A light sweeps along the top edge, the icon pulses softly and a block cursor blinks; with reduced motion the card is still.</desc><style>@media (prefers-reduced-motion: reduce){.fx{display:none}}</style><rect x=".5" y=".5" width="359" height="135" rx="4" fill="#081321" stroke="#253952"/><path d="M0 1H360" stroke="#cf8efc" stroke-width="2"/><path d="M38 30h3v3h-3zM38 33h6v3h-6zM38 36h6v3h-6zM38 39h6v3h-6zM29 42h24v3h-24zM20 45h42v3h-42zM29 48h24v3h-24zM38 51h6v3h-6zM38 54h6v3h-6zM35 57h12v3h-12zM32 60h18v3h-18zM38 63h6v3h-6z" fill="#cf8efc" shape-rendering="crispEdges"/><text x="86" y="53" fill="#cf8efc" font-family="monospace" font-size="14" font-weight="700">02 / FLIGHT DECK</text><text x="86" y="77" fill="#afbdd2" font-family="monospace" font-size="9">AVIATION · EXPLORATION</text><text x="86" y="106" fill="#8093ad" font-family="monospace" font-size="10" textLength="108" lengthAdjust="spacing">OPEN MISSION LOG →</text><g class="fx" shape-rendering="crispEdges"><rect x="-70" y="0" width="70" height="2" fill="#fff" opacity=".55"><animate attributeName="x" values="-70;360;360" keyTimes="0;.5;1" dur="6s" begin="0.5s" repeatCount="indefinite"/></rect><path d="M38 30h3v3h-3zM38 33h6v3h-6zM38 36h6v3h-6zM38 39h6v3h-6zM29 42h24v3h-24zM20 45h42v3h-42zM29 48h24v3h-24zM38 51h6v3h-6zM38 54h6v3h-6zM35 57h12v3h-12zM32 60h18v3h-18zM38 63h6v3h-6z" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;.2;0" keyTimes="0;.5;1" dur="4s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/></path><rect x="38" y="30" width="3" height="3" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;.9;0" keyTimes="0;.5;1" dur="3s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/></rect><rect x="199" y="97" width="6" height="10" fill="#8093ad" opacity="0"><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.5s" repeatCount="indefinite" calcMode="discrete"/></rect></g></svg>