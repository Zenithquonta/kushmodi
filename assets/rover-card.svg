<svg xmlns="http://www.w3.org/2000/svg" width="360" height="136" viewBox="0 0 360 136" role="img" aria-labelledby="t-rover d-rover"><title id="t-rover">04 / ROVER BAY</title><desc id="d-rover">Navigation card for the robotics and IGVC mission log, showing a pixel rover with a sensor mast and three wheels, the label 04 / ROVER BAY and the prompt to open the mission log. A light sweeps along the top edge, the icon pulses softly and a block cursor blinks; with reduced motion the card is still.</desc><style>@media (prefers-reduced-motion: reduce){.fx{display:none}}</style><rect x=".5" y=".5" width="359" height="135" rx="4" fill="#081321" stroke="#253952"/><path d="M0 1H360" stroke="#6fe3b4" stroke-width="2"/><path d="M35 30h12v3h-12zM35 33h3v3h-3zM44 33h3v3h-3zM38 36h6v3h-6zM38 39h6v3h-6zM23 42h36v3h-36zM20 45h42v3h-42zM23 48h36v3h-36zM26 51h3v3h-3zM38 51h6v3h-6zM53 51h3v3h-3zM23 54h6v3h-6zM35 54h12v3h-12zM53 54h6v3h-6zM20 57h12v3h-12zM35 57h12v3h-12zM50 57h12v3h-12zM20 60h12v3h-12zM35 60h12v3h-12zM50 60h12v3h-12zM23 63h6v3h-6zM35 63h12v3h-12zM53 63h6v3h-6z" fill="#6fe3b4" shape-rendering="crispEdges"/><text x="86" y="53" fill="#6fe3b4" font-family="monospace" font-size="14" font-weight="700">04 / ROVER BAY</text><text x="86" y="77" fill="#afbdd2" font-family="monospace" font-size="9">ROBOTICS · IGVC · ROS NOETIC</text><text x="86" y="106" fill="#8093ad" font-family="monospace" font-size="10" textLength="108" lengthAdjust="spacing">OPEN MISSION LOG →</text><g class="fx" shape-rendering="crispEdges"><rect x="-70" y="0" width="70" height="2" fill="#fff" opacity=".55"><animate attributeName="x" values="-70;360;360" keyTimes="0;.5;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></rect><path d="M35 30h12v3h-12zM35 33h3v3h-3zM44 33h3v3h-3zM38 36h6v3h-6zM38 39h6v3h-6zM23 42h36v3h-36zM20 45h42v3h-42zM23 48h36v3h-36zM26 51h3v3h-3zM38 51h6v3h-6zM53 51h3v3h-3zM23 54h6v3h-6zM35 54h12v3h-12zM53 54h6v3h-6zM20 57h12v3h-12zM35 57h12v3h-12zM50 57h12v3h-12zM20 60h12v3h-12zM35 60h12v3h