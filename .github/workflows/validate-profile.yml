name: Validate observatory profile
"on":
  push:
    paths:
      - README.md
      - assets/**
      - scripts/**
      - requirements.txt
      - .github/workflows/validate-profile.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/quality_gate.py
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
